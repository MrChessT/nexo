# Puerta de calidad: se ejecuta en cada push a main y en cada pull request.
# app: lint, tipos, tests y build. db: aplica todas las migraciones en un Postgres limpio y pasa
# los tests de permisos/RLS (supabase/tests). Si falla cualquiera de los dos, no se integra.
#
# Los fallos se publican como anotaciones: se ven en la pestaña del PR (y por la API) sin iniciar
# sesión, a diferencia de los registros completos del trabajo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores ficticios: el build no se conecta a Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # Solo los servicios que usan las migraciones y los tests (Postgres, Auth, Storage, API).
      - name: Base de datos local con todas las migraciones
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,studio,vector
      - name: Tests SQL (pgTAP)
        run: |
          set -o pipefail
          if ! supabase test db 2>&1 | tee pgtap.log; then
            grep -E "not ok|Failed|ERROR|error|Dubious|No plan" pgtap.log | head -30 | while IFS= read -r line; do
              echo "::error title=pgTAP::${line}"
            done
            { echo '### Tests SQL fallidos'; echo '```'; tail -80 pgtap.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Lint de funciones SQL
        run: |
          set -o pipefail
          if ! supabase db lint --level error 2>&1 | tee lint.log; then
            head -30 lint.log | while IFS= read -r line; do echo "::error title=db lint::${line}"; done
            exit 1
          fi
